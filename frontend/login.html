<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrgaTrack – Masuk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth rise">
    <span class="chip">OrgaTrack</span>
    <h1 id="judul">Masuk ke OrgaTrack</h1>
    <p class="sub">Kelola tugas, anggaran, dan rapat kepanitiaanmu di satu tempat.</p>

    <div class="seg">
      <button type="button" id="tMasuk" class="on">Masuk</button>
      <button type="button" id="tDaftar">Daftar</button>
    </div>

    <form id="form" novalidate>
      <label id="lNama" hidden>Nama lengkap
        <input name="nama" autocomplete="name">
      </label>
      <label>Email
        <input name="email" type="email" autocomplete="email">
      </label>
      <label>Kata sandi
        <input name="password" type="password" autocomplete="current-password">
      </label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" id="kirim">Masuk</button>
    </form>
  </main>
  <script src="auth.js"></script>
</body>
</html>
